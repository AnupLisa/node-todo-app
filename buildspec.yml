version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm install

  pre_build:
    commands:
      - echo Pre-build phase started

  build:
    commands:
      - echo Build phase started
      - echo No additional build step defined for this project

artifacts:
  files:
    - index.js
    - package.json
    - package-lock.json
    - Dockerfile
    - public/**/*
  discard-paths: no
  base-directory: .

cache:
  paths:
    - node_modules/**/*
